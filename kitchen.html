<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YaYa Chicken · Кухня</title>
<style>
:root {
  --orange: #F15A29;
  --orange-dark: #993C1D;
  --green: #34D07F;
  --green-light: #EAF3DE;
  --amber: #F5A623;
  --amber-light: #FAEEDA;
  --red: #FF5A5F;
  --red-light: #FCEBEB;
  --blue: #4A9BEF;
  --blue-light: #E6F1FB;
  --bg: #0A0A0B;
  --surface: #131316;
  --surface2: #1C1C20;
  --border: rgba(255,255,255,0.08);
  --text: #F0EDE6;
  --muted: #8A888F;
  --radius: 16px;
  --radius-sm: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; }

/* ── Header ── */
.header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 16px 24px; display: flex; align-items: center; gap: 16px;
}
.logo { font-size: 20px; font-weight: 700; }
.logo span { color: var(--orange); }
.header-sub { font-size: 13px; color: var(--muted); }
.header-clock { margin-left: auto; font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }

/* ── Tabs ── */
.tabs { display: flex; gap: 4px; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; overflow-x: auto; }
.tab {
  padding: 15px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
  border-bottom: 3px solid transparent; color: var(--muted); transition: all 0.15s;
  white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--orange); border-bottom-color: var(--orange); }
.tab-badge {
  display: inline-block; background: var(--red); color: #fff;
  font-size: 11px; padding: 1px 7px; border-radius: 99px; margin-left: 6px; font-weight: 700;
}
.tab-badge.amber { background: var(--amber); }

/* ── Content ── */
.content { padding: 20px 24px; min-height: calc(100vh - 120px); }
.panel { display: none; }
.panel.active { display: block; }

/* ── Stats bar ── */
.stats-bar { display: flex; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
.stat-chip {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 18px; display: flex; flex-direction: column; gap: 2px; min-width: 120px;
}
.stat-chip-label { font-size: 11px; color: var(--muted); }
.stat-chip-val { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }

/* ── Order grid ── */
.orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }

/* ── Order card ── */
.order-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; transition: border-color 0.2s; display: flex; flex-direction: column; gap: 12px;
}
.order-card.status-new  { border-color: rgba(74,155,239,0.4); }
.order-card.status-cook { border-color: rgba(245,166,35,0.5); }
.order-card.status-done { border-color: rgba(52,208,127,0.3); opacity: 0.65; }

.order-head { display: flex; align-items: center; gap: 12px; }
.otimer {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-width: 66px; height: 58px; border-radius: 14px; flex-shrink: 0;
}
.otimer .ov { font-size: 26px; font-weight: 900; line-height: 1; letter-spacing: -1px; }
.otimer .ol { font-size: 9px; font-weight: 700; letter-spacing: 0.02em; opacity: 0.85; margin-top: 2px; }
.order-num { font-size: 20px; font-weight: 800; color: var(--text); }
.order-time { font-size: 12px; color: var(--muted); margin-left: auto; }

.order-items-list { display: flex; flex-direction: column; gap: 6px; }
.order-item-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; background: var(--surface2); border-radius: var(--radius-sm);
  font-size: 14px;
}
.item-name { flex: 1; }
.item-qty { font-weight: 700; color: var(--orange); font-size: 16px; white-space: nowrap; }

.order-actions { display: flex; gap: 8px; }
.btn {
  flex: 1; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  cursor: pointer; font-size: 13px; font-weight: 600; background: var(--surface2); color: var(--text);
  transition: all 0.15s; text-align: center;
}
.btn:hover { background: rgba(255,255,255,0.08); }
.btn:active { transform: scale(0.97); }
.btn-cook { background: rgba(245,166,35,0.15); border-color: rgba(245,166,35,0.4); color: var(--amber); }
.btn-cook:hover { background: rgba(245,166,35,0.25); }
.btn-done { background: rgba(52,208,127,0.15); border-color: rgba(52,208,127,0.4); color: var(--green); }
.btn-done:hover { background: rgba(52,208,127,0.25); }

/* ── Per-dish tasks ── */
.dish-block { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; }
.dish-block.has-short { border-color: rgba(255,90,95,0.5); }
.dish-top { display: flex; align-items: center; gap: 8px; }
.dish-name { flex: 1; font-size: 14px; font-weight: 700; }
.dish-st { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.3px; }
.task-list { margin-top: 8px; display: flex; flex-direction: column; gap: 3px; }
.task-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; }
.task-row .tneed { font-weight: 600; }
.task-row .tshort { color: var(--red); }
.dish-actions { display: flex; gap: 6px; margin-top: 9px; }
.dish-actions .btn { flex: 1; padding: 8px; }

/* ── Status badge ── */
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; }
.badge-new  { background: rgba(74,155,239,0.15); color: var(--blue); }
.badge-cook { background: rgba(245,166,35,0.15); color: var(--amber); }
.badge-done { background: rgba(52,208,127,0.15); color: var(--green); }
.badge-fulfilled { background: rgba(52,208,127,0.15); color: var(--green); }
.badge-cancel { background: rgba(255,90,95,0.12); color: var(--red); }

/* ── Empty state ── */
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-text { font-size: 15px; }

/* ── All orders table ── */
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; padding: 10px 12px; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--border); font-size: 12px; }
td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: top; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--surface); }

/* ── Section title ── */
.section-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 14px; }

/* ── Notification ── */
#notif { position: fixed; top: 20px; right: 20px; background: var(--orange); color: #fff; padding: 14px 20px; border-radius: 12px; font-size: 15px; font-weight: 600; transform: translateX(120%); transition: transform 0.3s; z-index: 999; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
#notif.show { transform: translateX(0); }

/* ── Auth banner ── */
.auth-banner { display: none; margin-bottom: 16px; padding: 14px 16px; border: 1px solid rgba(255,170,0,0.4); border-radius: var(--radius); background: rgba(245,166,35,0.08); color: var(--amber); font-size: 13px; font-weight: 600; }
.auth-banner.show { display: block; }
.auth-banner button { margin-left: 8px; font-weight: 700; color: var(--orange); background: none; border: none; cursor: pointer; font-size: 13px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="logo">YaYa <span>Chicken</span></div>
    <div class="header-sub">Экран кухни</div>
  </div>
  <div class="header-clock" id="clock">--:--</div>
</div>

<div class="tabs">
  <div class="tab active" id="tb-new" onclick="switchTab('new')">Новые <span class="tab-badge" id="cnt-new" style="display:none">0</span></div>
  <div class="tab" id="tb-cook" onclick="switchTab('cook')">Готовятся <span class="tab-badge" id="cnt-cook" style="display:none">0</span></div>
  <div class="tab" id="tb-done" onclick="switchTab('done')">Готово</div>
  <div class="tab" id="tb-all" onclick="switchTab('all')">Все заказы</div>
</div>

<div class="content">
  <div class="auth-banner" id="auth-banner">Нет токена доступа к серверу.<button onclick="setToken()">Ввести токен</button></div>

  <div id="tab-new" class="panel active">
    <div class="stats-bar">
      <div class="stat-chip"><div class="stat-chip-label">Новых заказов</div><div class="stat-chip-val" id="s-new">0</div></div>
      <div class="stat-chip"><div class="stat-chip-label">Готовится</div><div class="stat-chip-val" id="s-cook" style="color:var(--amber)">0</div></div>
      <div class="stat-chip"><div class="stat-chip-label">Выдано сегодня</div><div class="stat-chip-val" id="s-done" style="color:var(--green)">0</div></div>
    </div>
    <div id="orders-new" class="orders-grid"></div>
  </div>

  <div id="tab-cook" class="panel">
    <div class="stats-bar">
      <div class="stat-chip"><div class="stat-chip-label">Готовится</div><div class="stat-chip-val" id="s-cook2" style="color:var(--amber)">0</div></div>
      <div class="stat-chip"><div class="stat-chip-label">Выдано сегодня</div><div class="stat-chip-val" id="s-done2" style="color:var(--green)">0</div></div>
    </div>
    <div id="orders-cook" class="orders-grid"></div>
  </div>

  <div id="tab-done" class="panel">
    <div id="orders-done" class="orders-grid"></div>
  </div>

  <div id="tab-all" class="panel">
    <div class="section-title">Все заказы за сегодня</div>
    <table>
      <thead><tr><th>Время</th><th>№</th><th>Состав</th><th>Сумма</th><th>Статус</th></tr></thead>
      <tbody id="orders-all-tbody"></tbody>
    </table>
  </div>
</div>

<div id="notif"></div>

<script src="data.js"></script>
<script>
var YKEY='yaya_key_kitchen';
var YAYA_API=window.YAYA_API||'https://yaya-db-production.up.railway.app';
function yTok(){return localStorage.getItem(YKEY)||''}
function setToken(){var t=prompt('Вставьте токен доступа:',yTok());if(t!==null){localStorage.setItem(YKEY,t.trim());location.reload();}}
function $i(id){return document.getElementById(id)}
var _ordCache=null,_ordT=0,_ordBusy={},_expand={};
var STATUS_RU={new:'Новый',cook:'Готовится',done:'Готов',fulfilled:'Выдан',cancel:'Отменён'};
var STATUS_CLASS={new:'badge-new',cook:'badge-cook',done:'badge-done',fulfilled:'badge-fulfilled',cancel:'badge-cancel'};
var TABS=['new','cook','done','all'];
var currentTab='new';

function orderColor(min){
  if(min<=10)return{col:'var(--green)',bg:'rgba(52,208,127,0.14)'};
  if(min<=20)return{col:'var(--amber)',bg:'rgba(245,166,35,0.14)'};
  return{col:'var(--red)',bg:'rgba(255,90,95,0.14)'};
}
function ordTimerHtml(ts){
  var min=Math.max(0,Math.floor((Date.now()-Number(ts))/60000));
  var c=orderColor(min);
  return '<div class="otimer" style="color:'+c.col+';background:'+c.bg+'"><div class="ov">'+min+'</div><div class="ol">мин</div></div>';
}

async function fetchOrders(){
  var now=Date.now();if(_ordCache&&now-_ordT<8000)return _ordCache;
  try{
    var r=await fetch(YAYA_API+'/orders?limit=80',{headers:{'X-Admin-Token':yTok()},cache:'no-store'});
    var d=await r.json();
    if(d&&d.ok&&Array.isArray(d.orders)){_ordCache=d.orders;_ordT=now;return _ordCache;}
    if(r.status===401&&$i('auth-banner'))$i('auth-banner').classList.add('show');
  }catch(e){}
  return _ordCache||[];
}
async function fetchTasks(id){
  try{
    var r=await fetch(YAYA_API+'/orders/'+encodeURIComponent(id)+'/tasks',{headers:{'X-Admin-Token':yTok()},cache:'no-store'});
    var d=await r.json();
    return d&&d.ok?d:null;
  }catch(e){return null;}
}
async function ordItem(id,did,action){
  var k=id+':'+did+':'+action;if(_ordBusy[k])return;_ordBusy[k]=true;
  try{
    var r=await fetch(YAYA_API+'/orders/'+encodeURIComponent(id)+'/item',{method:'POST',
      headers:{'Content-Type':'application/json','X-Admin-Token':yTok()},
      body:JSON.stringify({dishId:did,action}),cache:'no-store'});
    var d=await r.json();
    if(r.ok&&d&&d.ok){
      _ordCache=null;
      if(d.order_status==='done')notify('Заказ готов');
      render();
    }else{if(d&&d.error)notify(d.error);}
  }catch(e){notify('Ошибка сети');}
  finally{delete _ordBusy[k];}
}
async function reqPf(id,did){
  var o=(_ordCache||[]).find(function(x){return String(x.id)===String(id)});
  var dish=o&&o.data&&Array.isArray(o.data.items)?o.data.items.find(function(x){return String(x.id)===did}):null;
  if(!dish)return;
  var tc=(typeof getTechCards==='function')?getTechCards():[];
  var rows=tc[did]||[];
  var pfIds=rows.filter(function(r){
    var ws=(typeof getWsStock==='function')?getWsStock():[];
    return ws.some(function(s){return String(s.id)===String(r.ingId)})||/^p\d+$/.test(r.ingId)||String(r.ingId).indexOf('ready_')===0;
  }).map(function(r){return r.ingId});
  if(!pfIds.length){notify('Нет ПФ для запроса');return;}
  var n=0;
  for(var i=0;i<pfIds.length;i++){
    try{
      var rr=await fetch(YAYA_API+'/pf-requests',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Token':yTok()},body:JSON.stringify({item_id:pfIds[i]}),cache:'no-store'});
      var dd=await rr.json();if(rr.ok&&dd&&dd.ok)n++;
    }catch(e){}
  }
  if(n)notify('Запрос у цеха отправлен');
}

function dishRow(o,t,d,ds){
  var st=ds[t.dishId]||{status:'new',qty:t.qty};
  var noE=(typeof findMenuItem==='function')&&findMenuItem(t.dishId);
  var rowCls=t.noRecipe?'':(t.tasks.some(function(x){return !x.enough})?' has-short':'');
  var stL=st.status==='done'?'Готово':(st.status==='cook'?'В работе':'Взять');
  var stC=st.status==='done'?'var(--green)':(st.status==='cook'?'var(--amber)':'var(--blue)');
  var locked=(o.status==='done'||o.status==='fulfilled'||o.status==='cancel');
  var h='<div class="dish-block'+rowCls+'"><div class="dish-top"><div class="dish-name">'+(noE?noE.name:t.dishName)+'<span style="color:var(--muted);font-weight:600"> ×'+t.qty+'</span></div><div class="dish-st" style="color:'+stC+'">'+stL+'</div></div>';
  if(!t.noRecipe){
    h+='<div class="task-list">'+t.tasks.map(function(x){
      var col=x.enough?'var(--text)':'var(--red)';
      return '<div class="task-row" style="color:'+col+'"><span>'+x.name+'</span><span class="'+(x.enough?'tneed':'tshort')+'">'+( x.unit==='шт.'||x.unit==='бут.'?Math.round(x.need):x.need.toFixed(2))+' '+x.unit+(x.enough?'':' — не хватает')+'</span></div>';
    }).join('')+'</div>';
  }
  if(st.status!=='done'&&!locked){
    var acts='';
    if(st.status==='new')acts='<button class="btn btn-cook" onclick="ordItem('+o.id+',\''+t.dishId+'\',\'take\')">Взял</button>';
    else{
      var short=t.tasks.some(function(x){return !x.enough});
      acts='<button class="btn btn-done" onclick="ordItem('+o.id+',\''+t.dishId+'\',\'done\')">Готово</button>';
      if(short)acts+='<button class="btn" style="color:var(--red)" onclick="reqPf('+o.id+',\''+t.dishId+'\')">Запросить у цеха</button>';
    }
    h+='<div class="dish-actions">'+acts+'</div>';
  }
  h+='</div>';
  return h;
}

function orderCard(o){
  var mins=Math.max(0,Math.floor((Date.now()-Number(o.ts))/60000));
  var timer=ordTimerHtml(o.ts);
  var b=o.data||{},num=o.num||'?';
  var when=new Date(Number(o.ts)||Date.now()).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
  var items=(b&&Array.isArray(b.items))?b.items:[];
  var hasDish=Array.isArray(items)&&items.length>0;
  var bodyTxt=items.map(function(i){return i.name+' ×'+i.qty}).join(', ');
  var expand=_expand[o.id];
  return '<div class="order-card status-'+o.status+'">'
    +'<div class="order-head"><div class="otimer" style="color:'+orderColor(mins).col+';background:'+orderColor(mins).bg+'"><div class="ov">'+mins+'</div><div class="ol">мин</div></div>'
    +'<span class="order-num">#'+num+'</span><span class="order-time">'+when+'</span></div>'
    +'<div class="order-items-list"><div class="order-item-row"><span class="item-name">'+bodyTxt+'</span></div></div>'
    +'<div id="occ-'+o.id+'">'+(expand?'<div class="section-title">Задачи</div><div id="obd-'+o.id+'">загрузка…</div>':'<button class="btn" onclick="toggleTasks('+o.id+')">Задачи по блюдам</button>')+'</div>'
    +'</div>';
}
function toggleTasks(id){
  _expand[id]=!_expand[id];
  var c=$i('occ-'+id);
  if(!c)return;
  if(_expand[id]){
    c.innerHTML='<div class="section-title">Задачи</div><div id="obd-'+id+'">загрузка…</div>';
    loadTasks(id);
  }else{
    var o=_ordersCacheFind(id);
    c.innerHTML='<button class="btn" onclick="toggleTasks('+id+')">Задачи по блюдам</button>';
  }
}
function _ordersCacheFind(id){return (_ordCache||[]).find(function(x){return String(x.id)===String(id)})}

async function loadTasks(id){
  var o=_ordersCacheFind(id);if(!o)return;
  var d=await fetchTasks(id);
  var body=$i('obd-'+id);if(!body)return;
  if(!d){body.innerHTML='<div class="empty-text">Не удалось загрузить задачи</div>';return;}
  var ds=d.dish_status||{},tasks=d.tasks||[];
  body.innerHTML=tasks.map(function(t){return dishRow(o,t,d,ds)}).join('')||'<div class="empty-text">Нет задач</div>';
}

function render(){
  var orders=_ordCache||[];
  var today=new Date().toDateString();
  var todayOrders=orders.filter(function(o){return new Date(Number(o.ts)||Date.now()).toDateString()===today});
  var newOrd=todayOrders.filter(function(o){return o.status==='new'});
  var cookOrd=todayOrders.filter(function(o){return o.status==='cook'});
  var doneOrd=todayOrders.filter(function(o){return o.status==='done'});
  var fulOrd=todayOrders.filter(function(o){return o.status==='fulfilled'});

  $i('s-new').textContent=newOrd.length;
  $i('s-cook').textContent=cookOrd.length;
  $i('s-cook2').textContent=cookOrd.length;
  $i('s-done').textContent=doneOrd.length+fulOrd.length;
  $i('s-done2').textContent=doneOrd.length+fulOrd.length;
  $i('cnt-new').textContent=newOrd.length;
  $i('cnt-cook').textContent=cookOrd.length;
  $i('cnt-new').style.display=newOrd.length?'inline-block':'none';
  $i('cnt-cook').style.display=cookOrd.length?'inline-block':'none';

  function fill(elId,list){
    var el=$i(elId);
    if(!list.length){el.innerHTML='<div class="empty"><div class="empty-text">Нет заказов</div></div>';return;}
    el.innerHTML=list.map(orderCard).join('');
  }
  fill('orders-new',newOrd);
  fill('orders-cook',cookOrd);
  fill('orders-done',doneOrd);

  var tb=$i('orders-all-tbody');tb.innerHTML='';
  todayOrders.slice().reverse().forEach(function(o){
    var b=o.data||{},items=(b&&Array.isArray(b.items))?b.items:[];
    var names=items.map(function(i){return i.name+(i.qty>1?' ×'+i.qty:'')}).join(', ');
    var total=(Number(b.total)||0)+(Number(b.delivery)||0);
    var when=new Date(Number(o.ts)||Date.now()).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
    tb.innerHTML+='<tr><td>'+when+'</td><td style="font-weight:700;font-size:16px">#'+o.num+'</td><td style="color:var(--muted)">'+names+'</td><td style="font-weight:600;color:var(--orange)">'+fmt(total)+' тг</td><td><span class="badge '+(STATUS_CLASS[o.status]||'badge-new')+'">'+(STATUS_RU[o.status]||o.status)+'</span></td></tr>';
  });
}

function switchTab(id){
  currentTab=id;
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active')});
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  $i('tab-'+id).classList.add('active');
  $i('tb-'+id).classList.add('active');
  render();
}
function notify(msg){var el=$i('notif');el.textContent=msg;el.classList.add('show');setTimeout(function(){el.classList.remove('show')},3000);}
function updateClock(){$i('clock').textContent=new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});}
function fmt(n){return Math.round(Number(n||0)).toLocaleString('ru')}

async function tick(){
  await fetchOrders();
  render();
}
tick();
updateClock();
setInterval(function(){if(!document.hidden)tick();},8000);
setInterval(updateClock,1000);
window.addEventListener('yaya-menu-ready',function(){render()});
